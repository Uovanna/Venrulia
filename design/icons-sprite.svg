<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" id="venrulia-sprite">
<!-- ============================================================================
     VENRULIA ICON SPRITE — "drawn in the margin"
     ----------------------------------------------------------------------------
     Every glyph is stroke-only on a 24x24 grid at stroke-width 1.5, and every one
     inherits currentColor, so an icon is always the same ink as the text beside it.

     THE ROUGHNESS IS ONE FILTER, NOT 165 HAND-WOBBLED PATHS. feTurbulence drives
     an feDisplacementMap that pushes each stroke off its true line by about a
     pixel. That is what a nib does on a fibrous surface, and doing it centrally
     means the whole set shares one hand — the thing that actually reads as
     "drawn by a person" is consistency of error, not quantity of error.

     Strokes deliberately OVERSHOOT their joins by a hair. A drawn corner is two
     strokes that cross, never two strokes that meet exactly.

     Seeds differ per icon so neighbouring glyphs do not wobble identically.
     ============================================================================ -->
<defs>
  <filter id="quill" x="-25%" y="-25%" width="150%" height="150%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="quill-b" x="-25%" y="-25%" width="150%" height="150%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="23" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="quill-c" x="-25%" y="-25%" width="150%" height="150%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="3" seed="41" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g id="ink" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</defs>

