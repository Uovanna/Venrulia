<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <!-- The browser chrome takes the page's own ground, per theme. -->
    <meta name="theme-color" content="#DCD5C4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17130E" media="(prefers-color-scheme: dark)" />
    <title>Realms of Eldoria</title>
    <style>
      /* The ground behind the app, before any React has run. These are the same two
         values as --ground in design/tokens.css and must be changed with them —
         they cannot reference the token, because the token arrives with the
         stylesheet React injects, and the gap would flash the wrong colour.
         Left at #08080f this painted a black frame around the parchment on every
         screen, in both themes. */
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #DCD5C4; overscroll-behavior: none; }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background: #17130E; }
      }
      #root { min-height: 100vh; }
      * { -webkit-tap-highlight-color: transparent; }
      textarea, input { user-select: text; }
      .boot { color: #7A5C24; font-family: "Iowan Old Style", Charter, Palatino, Georgia, serif; text-align: center; padding-top: 42vh; font-size: 18px; }
      @media (prefers-color-scheme: dark) { .boot { color: #CBA455; } }
    </style>
    <!-- Supabase UMD → provides window.supabase (used by App.jsx for cloud saves + auth). Loads before the app module. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div id="root"><div class="boot">⚔️ Loading Realms of Eldoria…</div></div>
    <!-- Entry is inlined (no separate main.jsx). No JSX here, so it bundles as plain ESM;
         App.jsx (which does contain JSX) is transformed by @vitejs/plugin-react as a .jsx module. -->
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import App from "./src/App.jsx";
      createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
  </body>
</html>
