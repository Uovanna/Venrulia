# Netlify deploy config for Realms of Eldoria (Vite + React)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA + OAuth callback fallback: serve index.html for any path so Supabase's
# detectSessionInUrl redirect (e.g. /#access_token=...) always lands on the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
